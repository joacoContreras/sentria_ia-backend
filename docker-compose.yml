services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentria
      POSTGRES_USER: ${DB_USER:-sentria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentria}
      TZ: America/Argentina/Cordoba
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético solo la primera vez (volumen vacío)
      - ./sentria_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sentria_concurrencia.sql:/docker-entrypoint-initdb.d/02_concurrencia.sql:ro
      - ./sentria_notificaciones.sql:/docker-entrypoint-initdb.d/03_notificaciones.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sentria"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP de desarrollo: atrapa los correos sin enviarlos (UI en http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  api:
    build: .
    image: sentria-backend:latest
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SENTRIA_PORTAL_URL: ${PORTAL_URL:-http://localhost:3000}
      SENTRIA_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://sentria-ia-frontend.vercel.app}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sentria
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sentria}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-sentria}
      SPRING_JPA_SHOW_SQL: "false"
      DEV_INFO_ENABLED: "false"   # no exponer stack traces en las respuestas
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
