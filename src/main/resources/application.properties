spring.application.name=sentria

# El esquema lo crean sentria_schema.sql + sentria_concurrencia.sql.
# Hibernate NO lo toca: con update rompería EXCLUDE, dominios y funciones.
spring.datasource.url=jdbc:postgresql://localhost:5432/sentria
spring.datasource.username=sentria
spring.datasource.password=sentria
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=sentria
spring.jpa.open-in-view=false

dev.info.enabled=true

# CORS: origenes del frontend Next.js que pueden consumir la API (separados por coma, sin "/" final)
sentria.cors.allowed-origins=http://localhost:3000,https://sentria-ia-frontend.vercel.app
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=WARN
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR
logging.level.iua.edu.sentria=DEBUG

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Reintentos ante 55P03 (lock_timeout), 40001 (serialización) y 40P01 (deadlock)
sentria.turnos.reintentos=3

# Regla RF-04: el paciente puede cancelar/reprogramar desde el portal hasta N horas antes
sentria.turnos.horas-limite-cambios=24

# Notificaciones de turnos (RF-05)
#   canal: email (SMTP) | webhook (simulador; no se integran SMS pagos)
sentria.notificaciones.canal=email
sentria.notificaciones.recordatorio-horas-antes=24
sentria.notificaciones.max-intentos=3
sentria.notificaciones.lote=50
sentria.notificaciones.remitente=Sentria AI <no-responder@sentria.local>
sentria.notificaciones.webhook.url=
sentria.notificaciones.scheduler.habilitado=true
sentria.notificaciones.scheduler.intervalo-ms=60000
sentria.portal.url=http://localhost:3000

# SMTP: Mailpit del docker-compose (UI en http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Asistente IA: triage y guardrails (RF-06, RF-07, RNF-07)
#   El system prompt y las politicas de filtrado estan en src/main/resources/ia/.
#   La clave NUNCA se versiona: se pasa con la variable de entorno OPENAI_API_KEY.
sentria.ia.openai.api-key=${OPENAI_API_KEY:}
sentria.ia.openai.base-url=https://api.openai.com/v1
sentria.ia.openai.modelo=gpt-4o-mini
sentria.ia.openai.modelo-moderacion=omni-moderation-latest
sentria.ia.openai.temperatura=0.2
sentria.ia.openai.max-tokens=500
sentria.ia.openai.timeout-segundos=30
sentria.ia.moderacion.habilitada=true
